{% extends 'base.html' %}

{% block content %}
<section class="section error-section text-center">
    <div class="container">
        <div class="error-box">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">
                Sorry, the page you are looking for doesn't exist or has been moved.
            </p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary">Return to Homepage</a>
                <a href="{{ url_for('contact') }}" class="btn btn-outline">Contact Support</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
