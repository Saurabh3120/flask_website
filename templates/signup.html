{% extends 'base.html' %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="auth-card-wrapper">
            <div class="card auth-card">
                <div class="auth-header text-center">
                    <div class="auth-badge-icon">✨</div>
                    <h1 class="auth-title">Create an Account</h1>
                    <p class="auth-subtitle">Join FlaskCraft to manage messages and access protected features.</p>
                </div>

                <form action="{{ url_for('signup') }}" method="POST" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="name" class="form-label">
                            Full Name <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            class="form-control" 
                            placeholder="e.g. John Doe"
                            value="{{ form_data.get('name', '') }}" 
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">
                            Email Address <span class="required">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="you@example.com"
                            value="{{ form_data.get('email', '') }}" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">
                            Password <span class="required">*</span>
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="At least 6 characters"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm_password" class="form-label">
                            Confirm Password <span class="required">*</span>
                        </label>
                        <input 
                            type="password" 
                            id="confirm_password" 
                            name="confirm_password" 
                            class="form-control" 
                            placeholder="Re-type your password"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block auth-btn">
                        <span>Sign Up</span>
                        <span class="btn-arrow">&rarr;</span>
                    </button>
                </form>

                <div class="auth-footer text-center">
                    <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
