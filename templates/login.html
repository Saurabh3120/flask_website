{% extends 'base.html' %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="auth-card-wrapper">
            <div class="card auth-card">
                <div class="auth-header text-center">
                    <div class="auth-badge-icon">🔐</div>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Sign in to your account to manage messages and dashboard settings.</p>
                </div>

                <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="email" class="form-label">
                            Email Address <span class="required">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="you@example.com"
                            value="{{ email }}" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">
                            Password <span class="required">*</span>
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block auth-btn">
                        <span>Sign In</span>
                        <span class="btn-arrow">&rarr;</span>
                    </button>
                </form>

                <div class="auth-footer text-center">
                    <p>Don’t have an account yet? <a href="{{ url_for('signup') }}" class="auth-link">Create one here</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
