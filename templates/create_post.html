{% extends 'base.html' %}

{% block content %}
<section class="section create-post-section">
    <div class="container">
        <div class="create-post-wrapper">
            <div class="card create-post-card">
                <div class="create-post-header">
                    <span class="badge">Author Studio</span>
                    <h1 class="page-title">Publish New Blog Article</h1>
                    <p class="page-subtitle">Share your insights, code walkthroughs, or project updates with the community.</p>
                </div>

                <form action="{{ url_for('create_post') }}" method="POST" class="post-form">
                    <div class="form-group">
                        <label for="title" class="form-label">
                            Article Title <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            class="form-control" 
                            placeholder="e.g. 5 Reasons to Build Micro-services with Python Flask" 
                            value="{{ form_data.get('title', '') }}" 
                            required
                        >
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category" class="form-label">
                                Category / Topic
                            </label>
                            <input 
                                type="text" 
                                id="category" 
                                name="category" 
                                class="form-control" 
                                placeholder="e.g. Backend, Frontend, Databases, Architecture" 
                                value="{{ form_data.get('category', '') }}" 
                                list="category-suggestions"
                            >
                            <datalist id="category-suggestions">
                                <option value="Backend">
                                <option value="Frontend">
                                <option value="Databases">
                                <option value="DevOps">
                                <option value="Tutorial">
                            </datalist>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="content" class="form-label">
                            Article Content <span class="required">*</span>
                        </label>
                        <textarea 
                            id="content" 
                            name="content" 
                            class="form-control" 
                            rows="10" 
                            placeholder="Write your article content here in full paragraphs..." 
                            required
                        >{{ form_data.get('content', '') }}</textarea>
                    </div>

                    <div class="form-actions-bar">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <span>🚀 Publish Article</span>
                        </button>
                        <a href="{{ url_for('blog') }}" class="btn btn-secondary btn-lg">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
